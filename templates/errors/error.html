{% extends "base.html" %}
{% block title %}{{ code }} - SafeVault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card p-5">
            <div class="display-1 text-muted mb-2">{{ code }}</div>
            <h3 class="mb-2">{{ title }}</h3>
            <p class="text-muted mb-4">{{ message }}</p>
            <a href="{{ url_for('files.dashboard') if current_user.is_authenticated else url_for('auth.login') }}"
               class="btn btn-primary">
                {{ "Back to dashboard" if current_user.is_authenticated else "Go to login" }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
